[pytest]
pythonpath = .
testpaths = tests
# If anything blocks for 90s (deadlock, lock wait, subprocess prompt), dump
# every thread's stack trace so the hang is diagnosable instead of silent.
faulthandler_timeout = 90
filterwarnings =
    # The test SECRET_KEY is intentionally short; PyJWT warns about HMAC keys
    # under 32 bytes. Production enforces a strong key at startup (security.py).
    ignore::jwt.warnings.InsecureKeyLengthWarning

server {
    listen 80;
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # blob:/data: allowances cover PDF.js workers and generated label PDFs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    # Resolve the backend via Docker DNS on every request so nginx keeps
    # working when the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ES modules (.mjs — e.g. the PDF.js worker) must be served as JavaScript
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/javascript;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

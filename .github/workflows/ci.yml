name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nestbox
          POSTGRES_PASSWORD: nestbox
          POSTGRES_DB: nestbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nestbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # postgresql-client = pg_dump/pg_restore for the lifecycle tests
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils postgresql-client
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx pytest-timeout
      # -v writes per-test progress to stderr (unbuffered in CI, so we see live
      # progress instead of silent block-buffered stdout). --faulthandler-timeout
      # dumps every thread's stack if anything blocks for 90s — that names the
      # exact hanging call. --timeout fails the test itself at 180s.
      - run: pytest backend -v --timeout=180 --faulthandler-timeout=90
        env:
          DATABASE_URL: postgresql+psycopg2://nestbox:nestbox@localhost:5432/nestbox

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only
        working-directory: frontend
      # full report for the log (never fails the job)
      - run: npm audit --omit=dev || true
        working-directory: frontend
      # the actual gate; allowlisted advisories are documented in SECURITY.md
      # GHSA-qwww-vcr4-c8h2: react-router RSC-mode CSRF — N/A, client-only SPA
      - run: npx audit-ci --high --skip-dev --allowlist GHSA-qwww-vcr4-c8h2
        working-directory: frontend

  publish-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend-tests, frontend-build, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:latest
